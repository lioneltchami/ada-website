name: Deploy on Content Change

on:
  workflow_run:
    workflows: [CI]
    types:
      - completed
    branches: [main]
  schedule:
    # Weekly trigger; the job itself skips alternate weeks to behave biweekly.
    - cron: "15 23 * * 0"
  repository_dispatch:
    types: [sanity-content-update]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_run'

      - name: Biweekly schedule gate
        if: github.event_name == 'schedule'
        run: |
          week=$(date -u +%V)
          if [ $((10#$week % 2)) -ne 0 ]; then
            echo "Skipping this weekly refresh; biweekly archive deploy runs on even ISO weeks."
            exit 0
          fi

      - name: Sync source branch for workflow_run
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: production
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_SITE_URL: https://apotidev.org

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
